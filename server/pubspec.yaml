name: serena_server
description: Backend de Serena (Serverpod).
environment:
  sdk: '^3.8.0'
dependencies:
  serverpod: 3.4.12
  serverpod_auth_idp_server: 3.4.12
  serena_client:
    path: ../client
dev_dependencies:
  lints: '>=3.0.0 <7.0.0'
  serverpod_test: 3.4.12
  test: ^1.25.5
serverpod:
  scripts:
    # Starts the server and applies migrations
    start: dart bin/main.dart --apply-migrations