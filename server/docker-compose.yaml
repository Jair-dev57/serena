services:
  # Development services
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: serena
      POSTGRES_PASSWORD: "EpE97CQxiot5H_4va97run9KJsfvhfPX"
    volumes:
      - serena_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "bpCrNpfiXi0r5P94OKQ50rRNETnQhzdL"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: pgvector/pgvector:pg16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: serena_test
      POSTGRES_PASSWORD: "T9blZqgtXU1KoTcOvNagcx9HWPUv1vce"
    volumes:
      - serena_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "i3bcMVK1FRG9hKmP3rELl9dnnikCfNY3"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  serena_data:
  serena_test_data:
